<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>生活挑戰｜槓桿探索室</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><script src="practice.js" defer></script></head><body><header><a class="brand" href="index.html"><span class="logo">△</span> 槓桿探索室</a><nav aria-label="主導覽"><a href="rescue.html">救援挑戰</a><a href="index.html">自由實驗</a><a href="practice.html" aria-current="page">辨認三點</a></nav></header><main><div class="intro"><div><span class="eyebrow">生活中的槓桿 · 辨認挑戰</span><h1>找出三個關鍵位置</h1></div><p>把標籤拖到圖中的圓圈。<br>也可以先點選標籤，再點選位置。</p></div><div class="challenge-layout"><aside class="panel object-list"><h2>選擇物品</h2><div id="objects"></div><a class="back-link" href="index.html">返回槓桿實驗台</a></aside><section class="panel challenge"><div class="panel-heading"><div><span class="eyebrow" id="progress"></span><h2 id="object-title"></h2></div><button class="quiet" id="retry">重新放置</button></div><p id="scenario"></p><div id="diagram" class="object-diagram"></div><div class="label-tray" id="tray" aria-label="可拖動的標籤"></div><div class="actions"><button id="check" class="primary">檢查答案</button><button id="hint" class="quiet">給我提示</button><button id="next" class="quiet">下一件物品</button></div><div id="feedback" class="feedback" aria-live="polite">先找出物品繞着哪個位置轉動。</div></section></div><div class="definitions"><p><b class="pivot">支點</b>物品繞着轉動的位置。</p><p><b class="effort">力點</b>手或外力施力的位置。</p><p><b class="load">重點</b>重物或阻力作用的位置。</p></div></main><footer>圖像是位置示意圖。辨認時，想想物品如何轉動、在哪裏施力、在哪裏克服阻力。</footer></body></html>
